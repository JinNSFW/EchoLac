<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF4E2">
  <title>EchoLạc</title>
  <meta name="description" content="Luyện nói tiếng Anh với AI qua các tình huống văn hoá Đà Nẵng và Hội An.">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/logo-192.png">
  <link rel="preload" href="assets/logo.svg" as="image" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Splash: shown on cold start, removed by splash() in app.js. Delete this block to drop it. -->
  <div id="splash" class="splash" role="status" aria-label="Đang tải EchoLạc">
    <div class="sp-glow" aria-hidden="true"></div>
    <div class="sp-sparks" aria-hidden="true">
      <i style="--x:14%;--y:22%;--s:4px;--d:8s;--dl:-1s;--dx:10px"></i>
      <i style="--x:82%;--y:18%;--s:3px;--d:11s;--dl:-4s;--dx:-8px"></i>
      <i class="st" style="--x:22%;--y:64%;--s:9px;--d:9s;--dl:-2s;--dx:6px"></i>
      <i style="--x:78%;--y:60%;--s:4px;--d:12s;--dl:-6s;--dx:-10px"></i>
      <i style="--x:50%;--y:11%;--s:3px;--d:7s;--dl:-3s;--dx:8px"></i>
      <i style="--x:9%;--y:82%;--s:3px;--d:10s;--dl:-5s;--dx:12px"></i>
      <i class="st" style="--x:86%;--y:79%;--s:10px;--d:6s;--dl:-2s;--dx:-6px"></i>
      <i style="--x:62%;--y:88%;--s:3px;--d:9s;--dl:-7s;--dx:9px"></i>
    </div>
    <div class="sp-center">
      <div class="sp-logo">
        <svg class="sp-drum" viewBox="-180 -180 360 360" fill="none" stroke="currentColor" aria-hidden="true">
          <circle r="172" stroke-width="2"/><circle r="150" stroke-width="1.5"/>
          <circle r="128" stroke-width="30" stroke-dasharray="3 22.13"/>
          <circle r="108" stroke-width="2"/><circle r="96" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 9.425"/>
          <circle r="84" stroke-width="1.5"/>
        </svg>
        <div class="sp-tile"><div class="sp-face">
          <img src="assets/logo.svg" alt="" width="92" height="92" onerror="this.onerror=null;this.src='assets/logo-192.png'">
          <span class="sp-sheen" aria-hidden="true"></span>
        </div></div>
      </div>
      <p class="sp-word"><span class="sp-echo">Echo</span><span class="sp-lac">Lạc</span></p>
      <p class="sp-tag">Cùng kể chuyện quê hương bằng tiếng Anh</p>
    </div>
    <div class="sp-dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div class="bg" aria-hidden="true"></div>
  <div class="fx-layer" aria-hidden="true"></div>
  <main id="app" class="app"></main>
  <nav id="nav" class="nav" aria-label="Main"></nav>
  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
